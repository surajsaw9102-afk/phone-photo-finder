name: MCP Edge Function checks

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/mcp-check.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/mcp-check.yml"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check MCP and OAuth consent Edge Functions
        run: deno check supabase/functions/gallery-mcp/index.ts supabase/functions/oauth-consent/index.ts
